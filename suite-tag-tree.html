<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Suite 结构与 Tag</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1c1f;
  --fg-muted: #5f6368;
  --guide: rgba(26, 28, 31, 0.18);
  --hover: rgba(26, 28, 31, 0.07);
  --code-bg: rgba(26, 28, 31, 0.06);
  --tag-bg: #e8f0fe;
  --tag-fg: #174ea6;
  --focus: #1a73e8;
  --font: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  --mono: Consolas, ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181818;
    --fg: #f1f3f4;
    --fg-muted: #9aa0a6;
    --guide: rgba(255, 255, 255, 0.18);
    --hover: rgba(255, 255, 255, 0.09);
    --code-bg: rgba(255, 255, 255, 0.1);
    --tag-bg: #123a63;
    --tag-fg: #a8c7fa;
    --focus: #8ab4f8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }
h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.summary { margin: 0; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.note { margin: 8px 0 18px; color: var(--fg-muted); }
.note code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

.tree, .node, .children { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.children { margin-left: 16px; padding-left: 12px; border-left: 1px solid var(--guide); }
.children[hidden] { display: none; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
.slot { display: flex; align-items: center; justify-content: center; height: 28px; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fg-muted); }
.body { min-width: 0; padding-top: 3.5px; overflow-wrap: anywhere; }
.suite { font-weight: 600; }
.gap { margin-left: 6px; }
.desc { color: var(--fg-muted); font-size: 12px; }
.file { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 6px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tag { padding: 1px 8px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); font-size: 12px; line-height: 18px; }

.toggle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
.toggle:hover { background: var(--hover); }
.toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.toggle svg { display: block; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Test Suite 结构与 Tag</h1>
  <p class="summary" id="summary"></p>
  <p class="summary" id="meta"></p>
  <p class="note">
    按 suite、次级 suite、test 文件、test case 逐层展开。每一行只显示该层自己写的 tag：
    suite 和次级 suite 取自目录里的 <code>__init__.robot</code>，test 文件取自文件开头的设置，
    test case 取自它自己的 <code>[Tags]</code>。<code>robot:</code> 开头的内置 tag 已排除，
    没有 tag 的行不显示。鼠标停在 test case 名称上可以看到它在文件里的行号。
  </p>
  <ul class="tree" id="tree"></ul>
</main>

  //   test 文件 [名字下标, tag 下标数组或 null, test case 列表, 1]
  //   test case [名字下标, tag 下标数组或 null, 行号]
  const isFile = (node) => node.length === 4;
  const isCase = (node) => typeof node[2] === "number";
  const childrenOf = (node) => (Array.isArray(node[2]) ? node[2] : []);
  const tagsOf = (node) => (node[1] ? node[1].map((i) => POOL[i]) : []);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function setChevron(button, down) {
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("width", "16");
    svg.setAttribute("height", "16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", down ? "M4 6l4 4 4-4" : "M6 4l4 4-4 4");
    svg.appendChild(path);
    button.textContent = "";
    button.appendChild(svg);
  }

  function describe(node, isRootFile) {
    if (isCase(node)) return null;
    if (isFile(node)) {
      const count = node[2].length;
      const label = count ? count + " 个 test case" : "无 test case";
      return isRootFile ? label + " · 位于 " + ROOT_NAME + " 根目录" : label;
    }
    let dirs = 0;
    node[2].forEach((child) => {
      if (!isFile(child)) dirs += 1;
    });
    if (!node[2].length) return "无 test 文件";
    const parts = [];
    if (dirs) parts.push(dirs + " 个次级 suite");
    if (node[2].length - dirs) parts.push(node[2].length - dirs + " 个 test 文件");
    return parts.join(" · ");
  }

  function boxId(path) {
    return "children-" + path.split(".").join("-");
  }

  function buildRow(node, path, isRootFile) {
    const row = el("div", "row");
    const slot = el("span", "slot");
    const body = el("div", "body");
    const name = POOL[node[0]];

    if (childrenOf(node).length) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "toggle";
      button.dataset.path = path;
      button.setAttribute("aria-label", name);
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-controls", boxId(path));
      setChevron(button, false);
      slot.appendChild(button);
    } else if (isCase(node)) {
      const dot = el("span", "dot");
      dot.setAttribute("aria-hidden", "true");
      slot.appendChild(dot);
    }

    let nameEl;
    if (isFile(node)) {
      nameEl = el("code", "file", name);
    } else if (isCase(node)) {
      nameEl = el("span", "", name);
      nameEl.title = "在文件的第 " + node[2] + " 行";
    } else {
      nameEl = el("span", path.indexOf(".") === -1 ? "suite" : "", name);
    }
    body.appendChild(nameEl);

    const description = describe(node, isRootFile);
    if (description) {
      const gap = el("span", "gap");
      gap.appendChild(el("span", "desc", description));
      body.appendChild(gap);
    }
    tagsOf(node).forEach((tag) => {
      body.appendChild(document.createTextNode(" "));
      body.appendChild(el("span", "tag", tag));
    });

    row.appendChild(slot);
    row.appendChild(body);
    return row;
  }

  function buildNode(node, path, isRootFile) {
    const item = el("li", "node");
    item.appendChild(buildRow(node, path, isRootFile));
    if (childrenOf(node).length) {
      const box = el("ul", "children");
      box.id = boxId(path);
      box.hidden = true;
      item.appendChild(box);
    }
    return item;
  }

  function nodesAtPath(path) {
    const nodes = [];
    if (path === "") return nodes;
    let list = ROOT_NODES;
    for (const part of path.split(".")) {
      const node = list[Number(part)];
      if (!node) return null;
      nodes.push(node);
      list = childrenOf(node);
    }
    return nodes;
  }

  function childrenAtPath(path) {
    const nodes = nodesAtPath(path);
    if (!nodes) return [];
    return nodes.length ? childrenOf(nodes[nodes.length - 1]) : ROOT_NODES;
  }

  function setOpen(button, value) {
    const path = button.dataset.path;
    const box = document.getElementById(button.getAttribute("aria-controls"));
    if (!box) return;
    if (value && !box.hasChildNodes()) {
      const fragment = document.createDocumentFragment();
      childrenAtPath(path).forEach((node, i) => {
        fragment.appendChild(buildNode(node, path + "." + i, false));
      });
      box.appendChild(fragment);
    }
    box.hidden = !value;
    button.setAttribute("aria-expanded", value ? "true" : "false");
    setChevron(button, value);
  }

  function render() {
    const fragment = document.createDocumentFragment();
    ROOT_NODES.forEach((node, i) => {
      fragment.appendChild(buildNode(node, String(i), isFile(node)));
    });
    treeEl.appendChild(fragment);
  }

  function renderHeader() {
    const counts = { suite: 0, sub: 0, file: 0, case: 0 };
    const walk = (list, depth) => {
      list.forEach((node) => {
        if (isFile(node)) {
          counts.file += 1;
          counts.case += node[2].length;
        } else {
          counts[depth === 0 ? "suite" : "sub"] += 1;
          walk(node[2], depth + 1);
        }
      });
    };
    walk(ROOT_NODES, 0);
    const total = (value) => value.toLocaleString("en-US");
    summaryEl.textContent = [
      total(counts.suite) + " 个 suite",
      total(counts.sub) + " 个次级 suite",
      total(counts.file) + " 个 test 文件",
      total(counts.case) + " 个 test case",
    ].join(" · ");

    const parts = [];
    if (DATA.generated) parts.push("快照时间 " + DATA.generated.slice(0, 16).replace("T", " "));
    if (DATA.source) parts.push("来源目录 " + DATA.source);
    metaEl.textContent = parts.join(" · ");
  }

  treeEl.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    const button = target && target.closest(".toggle");
    if (!button || !treeEl.contains(button)) return;
    setOpen(button, button.getAttribute("aria-expanded") !== "true");
  });

  renderHeader();
  render();
})();
</script>
</body>
</html>
